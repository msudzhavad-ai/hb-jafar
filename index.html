<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приглашение на день рождения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Neucha&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   НАСТРОЙКИ СТРАНИЦЫ — меняйте только этот блок.
   Текст пишите между кавычками "...". Ссылки — полностью, с https://
   Картинки: вставьте ссылку на своё фото (например, загруженное на
   imgbb.com, Яндекс Диск с прямой ссылкой и т.п.) или имя файла,
   который лежит в той же папке, что и этот index.html (например "foto1.jpg").
   Если оставить пустые кавычки "" — будет показана заглушка.
   Чтобы спрятать целый раздел — поставьте show: false.
   ===================================================================== */
const CONFIG = {

  // ---- Цвета (можно взять любой цвет в формате #RRGGBB) ----
  colors: {
    background: "#f6f0e5",   // фон страницы (кремовый)
    accent:     "#a31c2d",   // заголовки, рамки, кнопки (бордовый)
    text:       "#3b3a36",   // обычный текст
    blue:       "#5b90ad",   // клетка на фоне блоков «Место» и «Пока-пока»
    blueLight:  "#b1cdd9",   // светлая рамка вокруг этих блоков
    star:       "#f6bb09"    // звёздочки
  },

  // ---- Шапка ----
  header: {
    show: true,
    line1: "Джафару",     // первая строка (в оригинале: «Мирону») — ВАШЕ ИМЯ в дательном падеже
    line2: "1",              // сколько исполняется
    line3: "год",            // «год» / «года» / «лет»
    bubble: "урааа!"         // надпись в облачке
  },

  // ---- Блок «дата рождения» в рамке ----
  intro: {
    show: true,
    title: "21 ноября",
    subtitle: "В нашей замечательной семье родился Джафар",
    text: "Вот уже целый год этот любитель спагетти, штор, маминых волос и папиных носков наполняет нашу жизнь смехом, нежностью и бесконечной любовью."
  },

  // ---- Блок «Поэтому» + календарь ----
  invite: {
    show: true,
    title: "Поэтому",
    text: [
      "Мы с огромной радостью приглашаем вас разделить с нами особенный день — первый день рождения нашего сына!"
    ],
    date: "2026-11-21"       // ДАТА ПРАЗДНИКА в формате ГГГГ-ММ-ДД (календарь построится сам)
  },

  // ---- Блок «Место встречи» (на голубой клетке) ----
  place: {
    show: true,
    themeLabel: "вечеринка в стиле",
    theme: "цирк",
    placeLabel: "место встречи:",
    placeName: "LOFT MONBINI",            // например «LOFT»
    address: "пр-кт Лихачева, д.20",
    mapButton: "открыть карту",
    mapUrl: "https://yandex.ru/maps/org/29893557636",      // ссылка на место в Яндекс/Google Картах
    timeLabel: "сбор гостей в",
    time: "16.00"
  },

  // ---- Дресс-код + листалка с образами ----
  dresscode: {
    show: true,
    text: "Достаём из гардероба всё самое цветное, весёлое и праздничное и отправляемся прямиком на цирковое представление",
    slideSeconds: 3,                        // через сколько секунд листать картинки
    images: ["", "", "", "", ""]            // ссылки на картинки-образы (формат 2:3, вертикальные)
  },

  // ---- Подарки / вишлист ----
  gifts: {
    show: true,
    question: "ну, естественно, что дарить?",
    title: "подарки",
    text: [
      "чтобы немного облегчить вам муки выбора, мы собрали вишлист Джафара с подарками, он точно будет рад",
      "вы можете выбрать что-нибудь из списка и забронировать подарок, чтобы он не повторился"
    ],
    button: "Вишлист",
    url: "https://ohmywishes.com/users/jafar"     // ссылка на ваш вишлист
  },

  // ---- «И самое милое» + фото по месяцам ----
  growth: {
    show: true,
    title: "и самое милое",
    text: [
      "посмотрите как Джафар вырос и менялся весь этот год!",
      "смотрите внимательно ведь он очень старался))"
    ],
    slideSeconds: 3,
    photos: [                               // добавляйте сколько угодно: { photo: "ссылка", caption: "подпись" }
      { photo: "", caption: "1 месяц" },
      { photo: "", caption: "2 месяца" },
      { photo: "", caption: "3 месяца" }
    ]
  },

  // ---- Финал ----
  bye: {
    show: true,
    title: "пока-пока",
    signature: "ваши Джафар"
  }
};
</script>

<style>
  :root{
    --bg:#f6f0e5; --accent:#a31c2d; --text:#3b3a36; --blue:#5b90ad; --blue-l:#b1cdd9; --star:#f6bb09;
    --green:#508760; --orange:#f64815; --navy:#2f5e9e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#e9e3d8}
  body{font-family:"Neucha","Balsamiq Sans",cursive;color:var(--text);-webkit-font-smoothing:antialiased}
  .page{max-width:540px;margin:0 auto;background:var(--bg);overflow:hidden;position:relative}
  a{color:inherit}
  .h{font-family:"Balsamiq Sans",cursive;font-weight:700;color:var(--accent);text-transform:uppercase;
     letter-spacing:.02em;line-height:.95;margin:0;text-align:center}
  .t{text-align:center;font-size:19px;line-height:1.2;margin:0 auto 14px;max-width:330px}
  section{position:relative;padding:28px 22px}
  .fade{opacity:0;transform:translateY(16px);transition:opacity 1s ease, transform 1s ease}
  .fade.in{opacity:1;transform:none}
  .emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}

  /* флажки */
  .bunting{display:block;width:100%;height:auto}

  /* шапка */
  .hero{padding:6px 0 0}
  .hero .h1{font-size:64px;margin-top:22px}
  .hero .age{font-size:150px;line-height:.85;margin:6px 0}
  .hero .h3{font-size:92px}
  .deco{position:absolute;font-size:56px}
  .bubble{position:absolute;left:40%;top:400px;background:#fff;border:2px solid var(--text);border-radius:50%;
          padding:6px 14px;font-size:18px;transform:rotate(-4deg)}
  .stripes{height:46px;margin-top:40px;
     background:linear-gradient(to bottom,transparent 0 6px,var(--accent) 6px 12px,var(--bg) 12px 15px,
       var(--star) 15px 21px,var(--bg) 21px 24px,var(--green) 24px 30px,var(--bg) 30px 33px,var(--orange) 33px 39px,transparent 39px);
     transform:skewY(-2deg)}

  /* рамка-билет */
  .frame{position:relative;border:7px solid var(--accent);border-radius:34px 30px 38px 28px/30px 36px 28px 34px;
         padding:34px 22px 30px;margin:10px 10px;background:var(--bg)}
  .frame:before,.frame:after{content:"";position:absolute;width:30px;height:30px;background:var(--bg);
         border:7px solid var(--accent);border-radius:50%}
  .frame:before{top:-19px;left:-19px;clip-path:inset(50% 0 0 50%)}
  .frame:after{bottom:-19px;right:-19px;clip-path:inset(0 50% 50% 0)}
  .frame .h{font-size:42px;margin:10px 0 18px}

  /* календарь */
  .date-big{font-family:"Balsamiq Sans";font-weight:700;color:var(--accent);font-size:48px;text-align:center;margin:20px 0 8px}
  .cal{max-width:330px;margin:0 auto}
  .cal-row{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:15px}
  .cal-line{height:5px;background:var(--green);border-radius:3px;margin:6px 0 16px}
  .cal-day{position:relative;height:30px;display:flex;align-items:center;justify-content:center}
  .cal-day.on:before{content:"";position:absolute;width:40px;height:40px;background:var(--star);
    clip-path:polygon(50% 0,61% 32%,95% 22%,70% 50%,95% 78%,61% 68%,50% 100%,39% 68%,5% 78%,30% 50%,5% 22%,39% 32%);z-index:0}
  .cal-day span{position:relative}
  .hats{font-size:44px;text-align:center;margin-top:26px;letter-spacing:-4px}

  /* голубая клетка */
  .gingham{padding:44px 34px;
    background-color:var(--blue);
    background-image:linear-gradient(90deg,rgba(255,255,255,.25) 50%,transparent 50%),
                     linear-gradient(rgba(255,255,255,.25) 50%,transparent 50%);
    background-size:44px 44px}
  .cloud{background:var(--bg);border-radius:46px;box-shadow:0 0 0 12px var(--blue-l);padding:34px 20px;text-align:center;position:relative}
  .cloud .lbl{font-size:20px;margin:0 0 4px}
  .cloud .h{font-size:50px;margin:0 0 22px}
  .cloud .big{font-family:"Balsamiq Sans";font-weight:700;color:var(--accent);font-size:44px;margin:0}
  .star{position:absolute;width:42px;height:42px;background:var(--star);
    clip-path:polygon(50% 0,61% 32%,95% 22%,70% 50%,95% 78%,61% 68%,50% 100%,39% 68%,5% 78%,30% 50%,5% 22%,39% 32%)}

  /* кнопка-овал */
  .oval{display:inline-block;position:relative;color:var(--accent);text-decoration:none;font-size:21px;
        padding:12px 46px;border:2px solid var(--accent);border-radius:50%;transform:rotate(-1.5deg);margin:6px 0 26px;transition:transform .2s}
  .oval:after{content:"";position:absolute;left:44%;right:16%;bottom:-6px;height:2px;background:var(--accent);border-radius:2px}
  .oval:hover{transform:rotate(-1.5deg) scale(1.05)}

  /* дресс-код */
  .dress .h{font-size:58px}
  .strike{position:relative;display:inline-block}
  .strike:after{content:"";position:absolute;left:-6px;right:-10px;top:42%;height:6px;background:var(--star);border-radius:4px;transform:rotate(-12deg)}
  .wave{display:inline-block;width:120px;height:40px;vertical-align:middle;margin-right:14px}

  /* листалка */
  .slider{position:relative;overflow:hidden}
  .slides{display:flex;transition:transform .6s ease}
  .slides > *{flex:0 0 100%}
  .slides img{display:block;width:100%;object-fit:cover}
  .ph{display:flex;align-items:center;justify-content:center;background:#ddd5c7;color:#8b8274;font-size:18px;text-align:center;padding:10px}
  .outfit img,.outfit .ph{aspect-ratio:2/3;width:100%}

  /* фото по месяцам */
  .month{text-align:center;padding:16px 0 10px;position:relative}
  .month .oval-photo{width:70%;aspect-ratio:1/1.1;margin:0 auto;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .month .oval-photo img,.month .oval-photo .ph{width:100%;height:100%;object-fit:cover}
  .month p{color:var(--accent);font-size:26px;margin:14px 0 0;font-family:"Neucha"}

  .bye .h{font-size:54px;margin-top:4px}
  .bye .sig{font-size:19px;margin:14px 0 0}
  .credit{ text-align:center;font-size:13px;color:#a9a091;padding:14px}
</style>
</head>
<body>
<div class="page" id="page"></div>

<script>
/* ======== Ниже — код, который строит страницу. Менять не нужно. ======== */
(function(){
  const C = CONFIG, r = document.documentElement.style;
  r.setProperty('--bg',C.colors.background); r.setProperty('--accent',C.colors.accent);
  r.setProperty('--text',C.colors.text); r.setProperty('--blue',C.colors.blue);
  r.setProperty('--blue-l',C.colors.blueLight); r.setProperty('--star',C.colors.star);

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const paras = arr => (Array.isArray(arr)?arr:[arr]).map(p=>`<p class="t">${esc(p)}</p>`).join('');
  const img = (src, label, cls='') => src ? `<img class="${cls}" src="${esc(src)}" alt="">`
                                          : `<div class="ph ${cls}">${esc(label)}</div>`;
  const star = (style) => `<i class="star" style="${style}"></i>`;

  // флажки-гирлянда (SVG)
  function bunting(){
    const fills=['url(#dots)','#2f5e9e','url(#str)','url(#dots2)','#a31c2d','url(#str2)','#2f5e9e'];
    let tri='';
    for(let i=0;i<7;i++){
      const x=i*80, y=10+Math.sin(i/6*Math.PI)*22;
      tri+=`<path d="M${x+4} ${y} L${x+76} ${y+4} L${x+42} ${y+78} Z" fill="${fills[i]}"/>`;
    }
    return `<svg class="bunting" viewBox="0 0 560 110" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#f6a011"/><circle cx="8" cy="8" r="3.5" fill="#2f5e9e"/></pattern>
        <pattern id="dots2" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#2f5e9e"/><circle cx="8" cy="8" r="3.5" fill="#f6bb09"/></pattern>
        <pattern id="str" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#e2412a"/><rect width="5" height="12" fill="#f6a011"/></pattern>
        <pattern id="str2" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="12" height="12" fill="#f6a011"/><rect width="5" height="12" fill="#e2412a"/></pattern>
      </defs>
      <path d="M0 8 Q280 60 560 8" stroke="#3b3a36" stroke-width="2" fill="none"/>${tri}</svg>`;
  }

  // календарь на неделю с датой праздника
  function calendar(iso){
    const d = new Date(iso+'T12:00:00');
    const dow = (d.getDay()+6)%7;  // 0 = понедельник
    const names=['пн','вт','ср','чт','пт','сб','вс'];
    let days='';
    for(let i=0;i<7;i++){
      const x=new Date(d); x.setDate(d.getDate()-dow+i);
      days+=`<div class="cal-day ${i===dow?'on':''}"><span>${x.getDate()}</span></div>`;
    }
    const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0');
    return `<div class="date-big">${dd}.${mm}.${d.getFullYear()}</div>
      <div class="cal"><div class="cal-row">${names.map(n=>`<div>${n.toUpperCase()}</div>`).join('')}</div>
      <div class="cal-line"></div><div class="cal-row">${days}</div></div>`;
  }

  function slider(items, seconds, cls){
    const id='s'+Math.random().toString(36).slice(2,7);
    setTimeout(()=>{
      const el=document.getElementById(id); if(!el||items.length<2) return; let i=0;
      setInterval(()=>{ i=(i+1)%items.length; el.style.transform=`translateX(-${i*100}%)`; }, seconds*1000);
    },0);
    return `<div class="slider ${cls}"><div class="slides" id="${id}">${items.join('')}</div></div>`;
  }

  let h='';
  if(C.header.show) h+=`
  <section class="hero fade" style="padding:0">
    ${bunting()}
    <div class="h h1 fit" style="z-index:10px;">${esc(C.header.line1)}</div>
    <div class="h age" style="z-index:10px;">${esc(C.header.line2)}</div>
    <div class="h h3" style="z-index:10px;">${esc(C.header.line3)}</div>
    <span class="deco emoji" style="left:4%;top:170px"><image style="height: 200px;" src="https://downloader.disk.yandex.ru/preview/b2d4b06cc3255468950beefd4c9b11b3c9126a15960638f76f329b2850c40df8/6ae91b94/62nKFisENKXv4xHdS8vD2L9qVKH_cIkMBYufoFjyDG7o1Qg2nZinhhE94fv_PrQBxBR7gP1QaY6YsFnKwCBYQQ%3D%3D?uid=0&filename=01122023_дамбо%20%2828%29.png&disposition=inline&hash=&limit=0&content_type=image%2Fpng&owner_uid=0&tknv=v3&is_direct_zip_experiment=1&size=2048x2048" alt="" /></span>
    <span class="deco emoji" style="right:5%;top:160px"><image style="height: 200px;" src="https://downloader.disk.yandex.ru/preview/6ab7b490f1135a2950e57853cae12c1160d06c6b16c722d5fdc9351cf48a4f50/6ae91bed/ZMFjCJEBpbRnggbylj7e_FgqxnK9VaMBlKQoV25KvC6PHodYrx0Y_WefmH-9b7jL686pz428FS_Z2lsMTM_c0A%3D%3D?uid=0&filename=23_04_2021_слоник%20%28158%29.png&disposition=inline&hash=&limit=0&content_type=image%2Fpng&owner_uid=0&tknv=v3&is_direct_zip_experiment=1&size=2048x2048" alt="" /></span>
    <span class="deco emoji" style="left:5%;top:380px"><image style="height: 200px;" src="https://png.pngtree.com/png-clipart/20240715/original/pngtree-cute-animal-friends-in-circus-tent-png-image_15561012.png" alt="" /></span>
    <span class="deco emoji" style="right:6%;top:350px"><image style="height: 200px;" src="https://i.pinimg.com/originals/ca/40/cd/ca40cd25731c2562b13f729922972333.png" alt="" /></span>
    <span class="deco emoji" style="left:42%;top:445px;font-size:50px"><image style="height: 200px;" src="https://downloader.disk.yandex.ru/preview/b2d4b06cc3255468950beefd4c9b11b3c9126a15960638f76f329b2850c40df8/6ae91b94/62nKFisENKXv4xHdS8vD2L9qVKH_cIkMBYufoFjyDG7o1Qg2nZinhhE94fv_PrQBxBR7gP1QaY6YsFnKwCBYQQ%3D%3D?uid=0&filename=01122023_дамбо%20%2828%29.png&disposition=inline&hash=&limit=0&content_type=image%2Fpng&owner_uid=0&tknv=v3&is_direct_zip_experiment=1&size=2048x2048" alt="" /></span>
    <span class="deco emoji" style="left:9%;top:440px;font-size:44px"><image style="height: 200px;"style="height: 250px;" src="https://downloader.disk.yandex.ru/preview/b2d4b06cc3255468950beefd4c9b11b3c9126a15960638f76f329b2850c40df8/6ae91b94/62nKFisENKXv4xHdS8vD2L9qVKH_cIkMBYufoFjyDG7o1Qg2nZinhhE94fv_PrQBxBR7gP1QaY6YsFnKwCBYQQ%3D%3D?uid=0&filename=01122023_дамбо%20%2828%29.png&disposition=inline&hash=&limit=0&content_type=image%2Fpng&owner_uid=0&tknv=v3&is_direct_zip_experiment=1&size=2048x2048" alt="" /></span>
    <span class="bubble">${esc(C.header.bubble)}</span>
    <div style="height:120px"></div><div class="stripes"></div>
  </section>`;

  if(C.intro.show) h+=`
  <section class="fade">
    <div class="frame">
      <div class="emoji" style="text-align:center;font-size:40px">🎪</div>
      <div class="h">${esc(C.intro.title)}</div>
      ${paras(C.intro.subtitle)}${paras(C.intro.text)}
      <div class="emoji" style="display:flex;justify-content:space-around;font-size:58px;margin-top:10px"><span>🐒🎈</span><span>🐊</span></div>
    </div>
  </section>`;

  if(C.invite.show) h+=`
  <section class="fade">
    <div class="h" style="font-size:56px;margin-bottom:22px">${esc(C.invite.title)}</div>
    ${paras(C.invite.text)}
    ${calendar(C.invite.date)}
    <div class="hats emoji" style="display:flex"><image style="height:260px; width:100%" src="https://images.greetingsisland.com/images/cards/birthday/previews/hats-off-21982.jpeg?auto=format,compress" alt="" /></div>
  </section>`;

  if(C.place.show){ const p=C.place; h+=`
  <section class="gingham fade">
    <div class="cloud">
      ${star('right:8%;top:96px;transform:rotate(15deg)')}${star('left:8%;top:290px;width:34px;height:34px')}${star('right:10%;bottom:80px;width:30px;height:30px')}
      <p class="lbl">${esc(p.themeLabel)}</p><div class="h">${esc(p.theme)}</div>
      <p class="lbl">${esc(p.placeLabel)}</p><div class="h fit" style="font-size:44px">${esc(p.placeName)}</div>
      <p class="lbl" style="margin-bottom:20px">${esc(p.address)}</p>
      <a class="oval" href="${esc(p.mapUrl)}" target="_blank" rel="noopener">${esc(p.mapButton)}</a>
      <p class="lbl">${esc(p.timeLabel)}</p><p class="big">${esc(p.time)}</p>
    </div>
  </section>`;}

  if(C.dresscode.show){ const d=C.dresscode; h+=`
  <section class="dress fade" style="padding-top:44px">
    <div class="h">дресс-<span class="strike">кот</span></div>
    <div class="h" style="margin:4px 0 26px"><svg class="wave" viewBox="0 0 120 40"><path d="M5 25 Q17 0 30 22 T55 22 T80 22 T105 18" stroke="#6cae3c" stroke-width="9" fill="none" stroke-linecap="round"/></svg>код</div>
    ${paras(d.text)}
  </section>
  ${slider(d.images.map((s,i)=>img(s,'Картинка образа '+(i+1)+'\n(формат 2:3)')), d.slideSeconds,'outfit fade')}`;}

  if(C.gifts.show){ const g=C.gifts; h+=`
  <section class="fade" style="padding:0">${bunting()}</section>
  <section class="fade" style="padding-top:0">
    <div class="frame" style="text-align:center">
      ${star('left:12%;top:30px;width:34px;height:34px')}${star('left:8%;bottom:80px')}${star('right:8%;bottom:90px;width:28px;height:28px')}
      <div class="emoji" style="font-size:44px">🥁</div>
      <p class="t" style="margin-top:18px">${esc(g.question)}</p>
      <div class="h">${esc(g.title)}</div>
      ${paras(g.text)}
      <a class="oval" href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.button)}</a>
    </div>
  </section>`;}

  if(C.growth.show){ const g=C.growth; h+=`
  <section class="fade">
    <div class="h" style="font-size:52px;text-align:left">${esc(g.title.split(' ').slice(0,2).join(' '))} <span class="emoji" style="font-size:44px">🦆</span></div>
    <div class="h" style="font-size:52px;text-align:right;padding-right:30px;margin-bottom:24px">${esc(g.title.split(' ').slice(2).join(' '))}</div>
    ${paras(g.text)}
  </section>
  ${slider(g.photos.map((p,i)=>`<div class="month">${star('left:10%;top:60%;width:30px;height:30px')}${star('right:10%;top:12%;width:30px;height:30px')}
      <div class="oval-photo">${img(p.photo,'Фото '+(i+1))}</div><p>${esc(p.caption)}</p></div>`), g.slideSeconds,'fade')}`;}

  if(C.bye.show) h+=`
  <section class="gingham fade" style="margin-top:20px">
    <div class="cloud">
      ${star('left:8%;top:110px;width:32px;height:32px')}${star('right:12%;top:70px;width:26px;height:26px')}
      <div class="h">${esc(C.bye.title.replace('-','-\n')).replace('\n','<br>')}</div>
      <div class="emoji" style="font-size:72px;margin-top:22px">🐘🎂🐊</div>
      <p class="sig">${esc(C.bye.signature)}</p>
    </div>
  </section>`;

  document.getElementById('page').innerHTML = h;

  // уменьшаем длинные заголовки, чтобы помещались в одну строку
  function fit(){ document.querySelectorAll('.fit').forEach(el=>{
    el.style.whiteSpace='nowrap'; el.style.fontSize=''; let fs=parseFloat(getComputedStyle(el).fontSize);
    const max=el.parentElement.clientWidth-24; el.style.width='max-content'; el.style.margin='0 auto';
    while(el.offsetWidth>max && fs>18){ fs-=2; el.style.fontSize=fs+'px'; }
    el.style.width=''; el.style.margin=''; }); }
  fit(); addEventListener('resize',fit); document.fonts && document.fonts.ready.then(fit);

  // плавное появление блоков при прокрутке (как в оригинале)
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.08});
  document.querySelectorAll('.fade').forEach(el=>io.observe(el));
  if(location.hash==='#static') document.querySelectorAll('.fade').forEach(el=>el.classList.add('in'));
})();
</script>
</body>
</html>
